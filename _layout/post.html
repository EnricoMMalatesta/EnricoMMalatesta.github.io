<!-- _layout/post.html -->
<!doctype html>
<html lang="en">
  <head>
    {{insert head.html}}
    <title>{{fill title}}</title>
  </head>

  <body>
    {{insert header.html}}

    <main class="content">
      <article class="post">
        <h1>{{fill title}}</h1>

        {{if hasdate}}
          <p class="post-meta">
            {{fill date}}
          </p>
        {{end}}

        <!-- The post content -->
        {{content}}

        <!-- Comments (Giscus) -->
        {{if comments}}
          <hr style="margin: 2.5rem 0;" />
          <h2>Comments</h2>

          <script src="https://giscus.app/client.js"
                  data-repo="YOUR_USER/YOUR_REPO"
                  data-repo-id="YOUR_REPO_ID"
                  data-category="General"
                  data-category-id="YOUR_CATEGORY_ID"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="bottom"
                  data-theme="preferred_color_scheme"
                  data-lang="en"
                  crossorigin="anonymous"
                  async>
          </script>
        {{end}}
      </article>
    </main>

    {{insert footer.html}}
  </body>
</html>
